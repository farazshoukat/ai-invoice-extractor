{% extends "base.html" %}
{% block title %}Upload · Invoice Extractor{% endblock %}
{% block body %}
<div class="wrap">
  <a class="back-link" href="{{ url_for('dashboard.view_dashboard') }}">&larr; Back to Dashboard</a>
  <div class="upload-card">
    <span class="stamp">Scan&nbsp;In</span>
    <h2>Upload Invoice / Receipt</h2>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="POST" enctype="multipart/form-data">
      <label class="file-picker" id="picker">
        <input type="file" name="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf" required>
        <span id="fileLabel">Click to choose a file (JPG, PNG, PDF)</span>
      </label>
      <button type="submit">Extract &amp; Save</button>
    </form>
  </div>
</div>
<script>
  const input = document.getElementById('fileInput');
  const label = document.getElementById('fileLabel');
  input.addEventListener('change', () => {
    label.textContent = input.files.length ? input.files[0].name : "Click to choose a file (JPG, PNG, PDF)";
  });
</script>
{% endblock %}
