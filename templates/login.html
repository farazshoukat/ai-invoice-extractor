{% extends "base.html" %}
{% block title %}Login · Invoice Extractor{% endblock %}
{% block body %}
<div class="auth-screen">
  <div class="auth-card">
    <span class="stamp">IE&nbsp;Ledger</span>
    <h2>Welcome back</h2>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
    <p class="switch">No account? <a href="{{ url_for('signup') }}">Sign up</a></p>
  </div>
</div>
{% endblock %}
