<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Invoice Extractor</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1a1a1a; padding: 40px; border-radius: 8px; width: 320px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #333; background: #0f0f0f; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #22c55e; border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error { color: #ef4444; font-size: 14px; }
        a { color: #22c55e; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Sign Up</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password (min 6 chars)" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</body>
</html>
